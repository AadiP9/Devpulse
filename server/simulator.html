<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DevPulse Alexa+ simulator</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151712'/%3E%3Cpath fill='%23E7E8E1' fill-rule='evenodd' d='M8 6h9a10 10 0 0 1 0 20H8zM13 11v10h4a5 5 0 0 0 0-10z'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #E7E8E1;
      --field: #F0F1EA;
      --ink: #151712;
      --mid: #4F5249;
      --rule: #B5B7AC;
      --code: #DCDED5;
      --accent: #2F4A3C;
      --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
      --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.55 var(--serif);
      display: flex;
      flex-direction: column
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: .9rem 1.5rem;
      border-bottom: 1px solid var(--ink)
    }

    header b {
      font-size: 1.15rem
    }

    header span {
      font: .8rem var(--mono);
      color: var(--mid)
    }

    .app {
      flex: 1;
      display: grid;
      grid-template-columns: 21rem 1fr;
      min-height: 0
    }

    aside {
      border-right: 1px solid var(--ink);
      overflow-y: auto;
      padding: 0 1.25rem
    }

    aside section {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--rule)
    }

    h2 {
      font: 700 .72rem var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: .6rem
    }

    input {
      width: 100%;
      background: var(--field);
      border: 1px solid var(--ink);
      padding: .55rem .65rem;
      font: .9rem var(--mono);
      color: var(--ink)
    }

    #hint {
      font-size: .85rem;
      color: var(--mid);
      margin-top: .4rem;
      min-height: 1.2rem
    }

    .preset {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
      padding: .6rem .75rem;
      margin-top: .5rem;
      cursor: pointer;
      font: inherit
    }

    .preset code,
    .lab {
      display: block;
      font: .72rem var(--mono);
      color: var(--mid)
    }

    .preset:hover {
      background: var(--ink);
      color: var(--paper)
    }

    .preset:hover code {
      color: var(--paper)
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .row {
      display: flex;
      gap: .5rem
    }

    #send {
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      padding: 0 1rem;
      font: 700 .9rem var(--serif);
      cursor: pointer
    }

    #clear {
      background: none;
      border: 0;
      color: var(--accent);
      text-decoration: underline;
      font: inherit;
      cursor: pointer;
      margin-top: .8rem
    }

    main {
      overflow-y: auto;
      padding: 1.5rem 2rem
    }

    .msg {
      padding: 1rem 0;
      border-top: 1px solid var(--rule);
      max-width: 46rem
    }

    .msg:first-child {
      border-top: 0
    }

    .q {
      font-weight: 700;
      font-size: 1.1rem
    }

    .ans {
      border: 1px solid var(--ink);
      padding: 1rem 1.25rem;
      margin: .75rem 0
    }

    .err {
      border: 1px dashed var(--ink);
      padding: 1rem 1.25rem;
      margin: .75rem 0
    }

    details summary {
      cursor: pointer;
      font: .8rem var(--mono);
      color: var(--mid)
    }

    pre {
      background: var(--code);
      border: 1px solid var(--ink);
      padding: .8rem;
      margin-top: .6rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font: .78rem/1.55 var(--mono)
    }

    .sk {
      height: .85rem;
      background: var(--code);
      margin-top: .6rem;
      animation: pulse 1.8s ease-in-out infinite
    }

    @keyframes pulse {
      50% {
        opacity: .4
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .sk {
        animation: none
      }
    }

    @media(max-width:760px) {
      .app {
        grid-template-columns: 1fr
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--ink)
      }
    }
  </style>
</head>

<body>
  <header><b>DevPulse</b><span>Alexa+ simulator &middot; <span id="status">Checking server</span> &middot; <span
        id="sess">No session</span></span></header>
  <div class="app">
    <aside>
      <section>
        <h2>Repository</h2><input id="repo" placeholder="owner/repo" autocomplete="off">
        <p id="hint" aria-live="polite"></p>
      </section>
      <section>
        <h2>Questions</h2>
        <div id="presets"></div>
      </section>
      <section>
        <h2>Your own question</h2>
        <div class="row"><input id="custom" placeholder="Ask about CI, tests, pull requests"><button
            id="send">Send</button></div><button id="clear">Clear conversation</button>
      </section>
    </aside>
    <main id="log">
      <p id="empty" style="color:var(--mid)">Enter a repository such as microsoft/vscode, then choose a question. Each
        question makes a real MCP call to the server.</p>
    </main>
  </div>
  <script>
    let sid = null, mid = 0, busy = false;
    const Q = { trace_breakage: 'Who broke main?', get_test_results: 'What failed in the last test run?', get_ci_status: 'What is the current CI status?', get_pr_summary: 'Show open pull requests', get_repo_activity: 'What happened in the repo this week?' };
    const A = { trace_breakage: r => ({ repo: r }), get_test_results: r => ({ repo: r }), get_ci_status: r => ({ repo: r }), get_pr_summary: r => ({ repo: r, limit: 5 }), get_repo_activity: r => ({ repo: r, days: 7 }) };
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    for (const t in Q) { const b = document.createElement('button'); b.className = 'preset'; b.innerHTML = esc(Q[t]) + '<code>' + t + '</code>'; b.onclick = () => run(Q[t], t); $('presets').appendChild(b) }
    function lock(v) { document.querySelectorAll('button').forEach(b => b.disabled = v) }
    function add(html, cls) { const d = document.createElement('div'); d.className = cls || 'msg'; d.innerHTML = html; $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight; return d }
    const err = m => '<div class="err"><span class="lab">Error</span>' + esc(m) + '</div>';
    async function check() { try { const r = await fetch('/health'); $('status').textContent = r.ok ? 'Server connected' : 'Server error'; if (r.ok && !sid) await init() } catch (e) { $('status').textContent = 'Server not reachable' } }
    async function init() { try { const r = await fetch('/mcp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-11-25', clientInfo: { name: 'alexa-simulator', version: '1.0' } } }) }); sid = r.headers.get('Mcp-Session-Id'); $('sess').textContent = sid ? 'Session ' + sid.slice(0, 8) : 'Session active' } catch (e) { } }
    async function call(tool, args) { const req = { jsonrpc: '2.0', id: ++mid, method: 'tools/call', params: { name: tool, arguments: args } }; const h = { 'Content-Type': 'application/json' }; if (sid) h['Mcp-Session-Id'] = sid; const r = await fetch('/mcp', { method: 'POST', headers: h, body: JSON.stringify(req) }); return { request: req, response: await r.json() } }
    function route(t) { t = t.toLowerCase(); if (/broke|breakage/.test(t)) return 'trace_breakage'; if (/test|fail/.test(t)) return 'get_test_results'; if (/pull request|\bprs?\b|review/.test(t)) return 'get_pr_summary'; if (/activity|week|commit|happened/.test(t)) return 'get_repo_activity'; return 'get_ci_status' }
    async function run(text, tool) {
      if (busy) return; const repo = $('repo').value.trim();
      if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { $('hint').textContent = 'Enter a repository as owner/repo, for example microsoft/vscode.'; $('repo').focus(); return }
      $('hint').textContent = ''; busy = true; lock(true); const e = $('empty'); if (e) e.remove();
      add('<span class="lab">You asked</span><p class="q">' + esc(text) + '</p>');
      const wait = add('<span class="lab">Calling ' + esc(tool) + '</span><div class="sk" style="width:90%"></div><div class="sk" style="width:75%"></div><div class="sk" style="width:60%"></div>');
      try {
        const { request, response } = await call(tool, A[tool](repo)); wait.remove();
        const r = response.result, t = r && r.content && r.content[0] && r.content[0].text;
        add('<details><summary>Tool call: ' + esc(tool) + '</summary><pre>' + esc(JSON.stringify(request, null, 2)) + '\n\n' + esc(JSON.stringify(response, null, 2)) + '</pre></details>');
        if (r && r.isError) add(err(t || 'The tool returned an error.'));
        else if (t) add('<div class="ans"><span class="lab">Answer</span>' + esc(t) + '</div>');
        else add(err(response.error ? response.error.message : 'No content returned.'));
      } catch (x) { wait.remove(); add(err('Could not reach the DevPulse server on port 8000.')) }
      busy = false; lock(false)
    }
    $('send').onclick = () => { const t = $('custom').value.trim(); if (t) { $('custom').value = ''; run(t, route(t)) } };
    $('custom').onkeydown = e => { if (e.key === 'Enter') $('send').click() };
    $('clear').onclick = () => { $('log').innerHTML = '<p style="color:var(--mid)">Conversation cleared.</p>'; sid = null; $('sess').textContent = 'No session'; init() };
    check(); setInterval(check, 30000);
  </script>
</body>

</html>
